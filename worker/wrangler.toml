name = "suvat-reader"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Lock the Worker to your site. Comma separated, no trailing slash.
# Leave empty ONLY while testing locally.
ALLOWED_ORIGINS = "https://suvatgraphingtool.github.io,http://localhost:4173"
# Which Gemini models read the questions, first choice first. A busy one hands on to the next,
# and so does one that has used its day: on the free tier each model has its own 20 a day.
# A ":low" after a name sets how hard it thinks; the default is "minimal", which 3.8 Flash refuses.
MODELS = "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash:low,gemini-3.6-flash"

# Per-IP rate limiting. Optional — without it the Worker still works and simply
# leans on Gemini's own 429. To enable:
#   npx wrangler kv namespace create RATE_KV
# then paste the printed id below and uncomment.
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "paste-the-id-here"

# The API key is NOT in this file and must never be. Set it as a secret:
#   npx wrangler secret put GEMINI_API_KEY
